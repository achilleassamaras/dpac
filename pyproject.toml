[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpac"
version = "1.1.0"
description = "Declared percentage-based author-contribution metrics from OpenAlex publication records."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "A. G. Samaras" },
]
keywords = [
    "bibliometrics",
    "research assessment",
    "CRediT",
    "author contribution",
    "OpenAlex",
    "h-index",
    "self-citation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "matplotlib",
    "pandas",
]
dev = [
    "pytest>=7",
]

[project.scripts]
dpac = "dpac.cli:main"

[project.urls]
Homepage = "https://github.com/achilleassamaras/dpac"
Issues = "https://github.com/achilleassamaras/dpac/issues"

[tool.setuptools]
packages = ["dpac"]
